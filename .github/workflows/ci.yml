name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"

jobs:
  core-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14.6"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6a191366842ac1502ba6c07e9b5acd5c2d9d8db3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --all-extras --group dev --group security
      - run: uv run --frozen pytest
      - run: uv run --frozen python scripts/check_schemas.py
      - run: uv run --frozen python scripts/check_fixtures.py
      - run: uv run --frozen python scripts/generate_references.py --check
      - run: uv run --frozen python scripts/check_publication_hygiene.py --source-tree
      - run: uv run --frozen cpcf agent explain --json
      - run: uv run --frozen cpcf self-check --json
      - run: uv run --frozen cpcf schema list --json

  quality-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6a191366842ac1502ba6c07e9b5acd5c2d9d8db3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14.6"
          enable-cache: true
      - run: uv sync --frozen --all-extras --group dev --group security
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check .
      - run: uv run --frozen mypy src packages/cpcf-api/src packages/cpcf-cli/src packages/cpcf-worker/src packages/cpcf-runner-protocol/src scripts
      - name: Overall branch coverage
        run: >-
          uv run --frozen pytest
          --cov=collective_phase_control_fabric --cov=cpcf_api --cov=cpcf_cli
          --cov=cpcf_worker --cov=cpcf_runner_protocol --cov-branch
          --cov-report=term-missing --cov-fail-under=90
      - name: Critical subsystem branch coverage
        run: >-
          uv run --frozen pytest
          tests/test_v6_api_assurance.py tests/test_v6_assurance_branches.py
          tests/test_v6_authority.py
          tests/test_v6_db_worker_assurance.py tests/test_v6_golden_semantics.py
          tests/test_v6_growth.py tests/test_v6_growth_evidence.py tests/test_v6_growth_cli.py
          tests/test_v6_growth_frontier.py tests/test_v6_frontier_evidence_cli.py
          tests/test_v6_epistemic.py tests/test_v6_epistemic_oracle.py
          tests/test_v6_epistemic_evidence.py tests/test_v6_composition.py
          tests/test_v6_epistemic_cli.py
          tests/test_v6_epistemic_limits.py tests/test_v6_information_value.py
          tests/test_v6_intervention.py
          tests/test_v6_cli_auth.py tests/test_v6_coordination_trial_assurance.py
          tests/test_v6_model_assurance.py tests/test_v6_models_trust.py
          tests/test_v6_onboarding_repairs.py
          tests/test_v6_package_interfaces.py tests/test_v6_planning_assurance.py
          tests/test_v6_runner_gateway.py
          tests/test_v6_science_assurance.py tests/test_v6_science_planner.py
          tests/test_v6_service_boundaries.py tests/test_v6_structural_analysis.py
          --cov=collective_phase_control_fabric.v6 --cov=cpcf_api --cov=cpcf_cli
          --cov=cpcf_worker --cov=cpcf_runner_protocol --cov-branch
          --cov-report=term-missing --cov-report=json:critical-coverage.json
          --cov-fail-under=95
      - name: Enforce every critical subsystem independently
        run: >-
          uv run --frozen python scripts/check_critical_coverage.py
          critical-coverage.json --minimum 95
      - run: uv run --frozen bandit -c pyproject.toml -r src packages
      - run: >-
          uv run --frozen pip-audit --local --cache-dir .cache/pip-audit
          --vulnerability-service osv --timeout 60
      - run: uv build
      - run: uv run --frozen python scripts/run_growth_examples.py --check
      - run: uv run --frozen python scripts/run_frontier_examples.py --check
      - run: uv run --frozen python scripts/run_epistemic_examples.py --check
      - run: uv run --frozen python scripts/check_release_artifacts.py --dist dist --metadata-out release-metadata
      - run: uv run --frozen twine check dist/*
      - run: uv run --frozen python scripts/generate_sbom.py uv.lock release-metadata/cpcf-sbom.cdx.json
      - run: uv run --frozen python scripts/check_publication_hygiene.py --archive dist/*.whl --archive dist/*.tar.gz
      - name: Lint and render Helm chart with pinned Helm 3.21.1
        run: |
          curl --fail --silent --show-error --location --output /tmp/helm.tar.gz https://get.helm.sh/helm-v3.21.1-linux-amd64.tar.gz
          echo "a349c62d6ab2d5d11f044fc0d3afa6deed7d27cc7d5c351f536b169d9fc2cc1a  /tmp/helm.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/helm.tar.gz --directory /tmp
          /tmp/linux-amd64/helm lint deploy/helm/cpcf --kube-version 1.36.0 --set image.api.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          /tmp/linux-amd64/helm template test deploy/helm/cpcf --kube-version 1.36.0 --set image.api.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa >/dev/null
          /tmp/linux-amd64/helm template test deploy/helm/cpcf --kube-version 1.36.0 --set image.api.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa --set worker.enabled=true --set worker.tenantId=tenant-a --set image.worker.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb --set migration.enabled=true --set image.migration.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc >/dev/null

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_PASSWORD: cpcf-test
          POSTGRES_USER: cpcf_owner
          POSTGRES_DB: cpcf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cpcf_owner -d cpcf"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6a191366842ac1502ba6c07e9b5acd5c2d9d8db3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14.6"
      - run: uv sync --frozen --all-extras --group dev --group security
      - run: uv run --frozen alembic -c deploy/alembic.ini upgrade head
        env:
          CPCF_DATABASE_URL: postgresql+psycopg://cpcf_owner:cpcf-test@localhost:5432/cpcf
      - run: uv run --frozen python scripts/configure_test_database.py
        env:
          CPCF_DATABASE_OWNER_URL: postgresql+psycopg://cpcf_owner:cpcf-test@localhost:5432/cpcf
          CPCF_DATABASE_APP_PASSWORD: cpcf-app-test
      - run: uv run --frozen pytest -m postgres
        env:
          CPCF_TEST_DATABASE_URL: postgresql+psycopg://cpcf_app_test:cpcf-app-test@localhost:5432/cpcf
          CPCF_TEST_OWNER_DATABASE_URL: postgresql+psycopg://cpcf_owner:cpcf-test@localhost:5432/cpcf

  mutation-shards:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 0, selector: "*__mutmut_*[05]"}
          - {shard: 1, selector: "*__mutmut_*[16]"}
          - {shard: 2, selector: "*__mutmut_*[27]"}
          - {shard: 3, selector: "*__mutmut_*[38]"}
          - {shard: 4, selector: "*__mutmut_*[49]"}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6a191366842ac1502ba6c07e9b5acd5c2d9d8db3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14.6"
          enable-cache: true
      - run: uv sync --frozen --all-extras --group dev --group security
      - name: Prepare isolated mutation layout
        run: uv run --frozen python -m scripts.prepare_mutation_workspace .cache/mutation-workspace
      - name: Run assigned mutants
        timeout-minutes: 300
        working-directory: .cache/mutation-workspace
        env:
          MUTATION_SELECTOR: ${{ matrix.selector }}
        run: |
          uv sync --frozen --all-extras --group dev --group security
          uv run --frozen mutmut run "$MUTATION_SELECTOR"
      - run: uv run --frozen mutmut results --all true > mutation-results.txt
        working-directory: .cache/mutation-workspace
        if: ${{ always() }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
            name: mutation-shard-${{ matrix.shard }}
            path: .cache/mutation-workspace/mutation-results.txt
            if-no-files-found: error
            retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: mutation-source-map-${{ matrix.shard }}
          path: .cache/mutation-workspace/mutation-source-manifest.json
          if-no-files-found: error
          retention-days: 14

  mutation:
    needs: mutation-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard job to succeed
        if: ${{ needs.mutation-shards.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6a191366842ac1502ba6c07e9b5acd5c2d9d8db3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14.6"
      - run: uv sync --frozen --all-extras --group dev --group security
      - uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317
        with:
          pattern: mutation-shard-*
          path: mutation-shards
      - run: >-
          uv run --frozen python -m scripts.merge_mutation_results
          mutation-shards mutation-results.txt --catalogue audit/mutation-catalogue-v0.7.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mutation-results
          path: mutation-results.txt
          if-no-files-found: error
          retention-days: 14
      - run: uv run --frozen python -m scripts.check_mutation_scope mutation-results.txt
      - run: uv run --frozen python scripts/check_mutation_score.py mutation-results.txt --minimum 85

  reference-operations:
    name: Reference load, chaos, and restore evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6a191366842ac1502ba6c07e9b5acd5c2d9d8db3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14.6"
      - run: uv sync --frozen --all-extras --group dev --group security
      - name: Execute bounded reference harnesses
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/cpcf-reference-evidence
          CPCF_COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$EVIDENCE_DIR"
          uv run --frozen python scripts/run_load_harness.py --commit "$CPCF_COMMIT_SHA" --out "$EVIDENCE_DIR/load.json"
          uv run --frozen python scripts/run_chaos_harness.py --commit "$CPCF_COMMIT_SHA" --out "$EVIDENCE_DIR/chaos.json"
          uv run --frozen python scripts/run_restore_harness.py --commit "$CPCF_COMMIT_SHA" --out "$EVIDENCE_DIR/restore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reference-operations-evidence
          path: ${{ runner.temp }}/cpcf-reference-evidence/*.json
          if-no-files-found: error
          retention-days: 14
